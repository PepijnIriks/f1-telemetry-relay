# Runs the tests on GitHub for every push and pull request (green check = all tests passed).
name: tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      db:                                   # a throw-away PostgreSQL 16 with TimescaleDB, only for the tests
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: f1test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/f1test
